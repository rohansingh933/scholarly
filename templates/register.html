{% extends "base.html" %}
{% block title %}Create account | Scholarly{% endblock %}
{% block content %}
<div class="narrow">
  <h1 style="font-size:2rem">Create your account</h1>
  <p class="muted">Save your details once, and see matches and saved scholarships on any device.</p>
  <form class="panel" method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Your name</label><input type="text" id="name" name="name" autocomplete="name" required maxlength="80" value="{{ request.form.get('name', '') }}"></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required value="{{ request.form.get('email', '') }}"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>
    <div class="field"><label for="confirm">Confirm password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required></div>
    <button class="btn btn-gold" type="submit" style="width:100%">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}

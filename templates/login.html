{% extends "base.html" %}
{% block title %}Log in | Scholarly{% endblock %}
{% block content %}
<div class="narrow">
  <h1 style="font-size:2rem">Log in</h1>
  <form class="panel" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required value="{{ request.form.get('email', '') }}"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" style="width:100%">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
